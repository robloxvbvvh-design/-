[hidden]{display:none!important}

.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 18px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,4.5vw,40px);letter-spacing:.02em;margin:0;text-wrap:balance}
h1 span{color:var(--alarm)}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.player{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 30px 80px -30px rgba(255,90,40,.25)}
.player canvas{display:block;width:100%;height:100%}
.player:fullscreen{border-radius:0}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(ellipse at center,rgba(0,0,0,.25),rgba(0,0,0,.7));text-align:center;padding:16px}
.overlay h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,64px);margin:0;letter-spacing:.04em;text-shadow:0 2px 20px rgba(0,0,0,.8)}
.overlay p{margin:0;color:var(--fg);opacity:.85;font-size:clamp(13px,1.8vw,16px)}
.big{display:inline-flex;align-items:center;gap:10px;font:500 16px/1 var(--body);color:#120806;background:var(--fg);border:0;border-radius:999px;padding:14px 24px;cursor:pointer}
.big:hover{background:#fff}
.big.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px rgba(235,231,222,.5)}
.big.ghost:hover{background:rgba(255,255,255,.08)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.eps{display:flex;gap:8px;flex-wrap:wrap}
.ep{display:flex;align-items:baseline;gap:8px;background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font:inherit;cursor:pointer}
.ep b{font-weight:500;color:var(--fg)}
.ep[aria-pressed="true"]{border-color:var(--alarm);color:var(--fg)}
.ep[aria-pressed="true"] b{color:var(--alarm)}
.big svg{width:16px;height:16px;fill:currentColor}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.controls{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.icon{flex:none;width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:4px;background:transparent;color:var(--fg);cursor:pointer}
.icon:hover{background:var(--line)}
.icon svg{width:18px;height:18px;fill:currentColor}
#seek{flex:1;min-width:0;accent-color:var(--amber);height:4px;cursor:pointer}
.time{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.script h3{font-family:var(--mono);font-weight:400;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 10px}
.lines{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:4px}
.line{display:flex;gap:12px;align-items:baseline;text-align:left;width:100%;min-width:0;background:transparent;border:0;border-left:2px solid transparent;color:var(--fg);font:inherit;padding:6px 10px;cursor:pointer;border-radius:0 4px 4px 0}
.line:hover{background:var(--panel)}
.line b{font-family:var(--mono);font-weight:400;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.line.on{border-left-color:var(--alarm);background:var(--panel)}
.line.on span{color:#fff}
@media (max-width:520px){.controls{gap:6px;padding:6px 8px}.time{font-size:12px}}
