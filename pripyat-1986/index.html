<style>
/* Layout: one cinema screen, a thin control strip under it, then the script as a clickable timeline. Single dark look by choice (it is a film). */
:root{
  --ink:#0c0e11;        /* page ground */
  --panel:#15191e;      /* control strip, script rows */
  --line:#262c34;       /* hairlines */
  --fg:#ebe7de;         /* main text */
  --muted:#8b939c;      /* secondary text */
  --alarm:#ff3b2f;      /* spoken word, alarm red */
  --amber:#f0a640;      /* fire glow, progress */
  --display:"Russo One","Rubik",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"PT Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--ink);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 18px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,4.5vw,40px);letter-spacing:.02em;margin:0;text-wrap:balance}
h1 span{color:var(--alarm)}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.player{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 30px 80px -30px rgba(255,90,40,.25)}
.player canvas{display:block;width:100%;height:100%}
.player:fullscreen{border-radius:0}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(ellipse at center,rgba(0,0,0,.25),rgba(0,0,0,.7));text-align:center;padding:16px}
.overlay h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,64px);margin:0;letter-spacing:.04em;text-shadow:0 2px 20px rgba(0,0,0,.8)}
.overlay p{margin:0;color:var(--fg);opacity:.85;font-size:clamp(13px,1.8vw,16px)}
.big{display:inline-flex;align-items:center;gap:10px;font:500 16px/1 var(--body);color:#120806;background:var(--fg);border:0;border-radius:999px;padding:14px 24px;cursor:pointer}
.big:hover{background:#fff}
.big svg{width:16px;height:16px;fill:currentColor}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.controls{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.icon{flex:none;width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:4px;background:transparent;color:var(--fg);cursor:pointer}
.icon:hover{background:var(--line)}
.icon svg{width:18px;height:18px;fill:currentColor}
#seek{flex:1;min-width:0;accent-color:var(--amber);height:4px;cursor:pointer}
.time{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.script h3{font-family:var(--mono);font-weight:400;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 10px}
.lines{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:4px}
.line{display:flex;gap:12px;align-items:baseline;text-align:left;width:100%;min-width:0;background:transparent;border:0;border-left:2px solid transparent;color:var(--fg);font:inherit;padding:6px 10px;cursor:pointer;border-radius:0 4px 4px 0}
.line:hover{background:var(--panel)}
.line b{font-family:var(--mono);font-weight:400;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.line.on{border-left-color:var(--alarm);background:var(--panel)}
.line.on span{color:#fff}
@media (max-width:520px){.controls{gap:6px;padding:6px 8px}.time{font-size:12px}}
</style>

function scTV(t) {

function scSleep(t) {

const SCENES = [
  [0, 3.35, scPripyat], [3.35, 7.12, scDate], [7.12, 14.05, scPlant], [14.05, 19.3, scDima],
  [19.3, 26.9, scItems], [26.9, 31.62, scHome], [31.62, 38.9, scBasement], [38.9, 41.95, scStairs],
  [41.95, 46.1, scStreet], [46.1, 54.15, scTV], [54.15, 999, scSleep]
];

/* ---------- subtitles: the spoken word lights up red ---------- */
function currentSeg(t) {
  for (let i = SUBS.length - 1; i >= 0; i--) {
    const s = SUBS[i];
    if (t >= s[0] - .05) { const next = SUBS[i + 1]; const until = Math.min(next ? next[0] - .05 : 999, s[1] + .9); return t < until ? i : -1; }
  }
  return -1;
}
function subtitles(t) {
  const i = currentSeg(t); if (i < 0) return;
  const words = SUBS[i][2];
  ctx.save(); ctx.font = '700 36px Rubik'; ctx.textBaseline = 'alphabetic';
  const space = ctx.measureText(' ').width + 10, maxW = 1060;
  const lines = [[]]; let lw = 0;
  words.forEach((w, j) => { const ww = ctx.measureText(w[0]).width; if (lw + ww > maxW && lines[lines.length - 1].length) { lines.push([]); lw = 0; } lines[lines.length - 1].push([w, j, ww]); lw += ww + space; });
  const lh = 48, y0 = H - 46 - (lines.length - 1) * lh;
  const band = ctx.createLinearGradient(0, y0 - 80, 0, H); band.addColorStop(0, 'rgba(0,0,0,0)'); band.addColorStop(1, 'rgba(0,0,0,.65)');
  ctx.fillStyle = band; ctx.fillRect(0, y0 - 80, W, H - y0 + 80);
  lines.forEach((ln, li) => {
    const total = ln.reduce((a, [, , ww]) => a + ww, 0) + space * (ln.length - 1);
    let x = (W - total) / 2; const y = y0 + li * lh;
    ln.forEach(([w, j, ww]) => {
      const next = words[j + 1], endT = next ? Math.min(next[1], w[2] + .25) : w[2] + .25;
      const active = t >= w[1] && t < endT, past = t >= endT;
      const pop = active ? 1 + .05 * Math.max(0, 1 - (t - w[1]) * 6) : 1;
      ctx.save(); ctx.translate(x + ww / 2, y - 12); ctx.scale(pop, pop); ctx.translate(-ww / 2, 12);
      ctx.lineJoin = 'round'; ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.strokeText(w[0], 0, 0);
      if (active) { ctx.shadowColor = 'rgba(255,40,30,.9)'; ctx.shadowBlur = 18; ctx.fillStyle = '#ff3b2f'; }
      else ctx.fillStyle = past ? '#ffffff' : 'rgba(255,255,255,.5)';
      ctx.fillText(w[0], 0, 0); ctx.restore();
      x += ww + space;
    });
  });
  ctx.restore();
}

/* ---------- frame ---------- */
let vign = null;
function frame(t, { subs = true } = {}) {
  ctx.setTransform(cvs.width / W, 0, 0, cvs.height / H, 0, 0);
  ctx.globalAlpha = 1; ctx.filter = 'none';
  const sc = SCENES.find(s => t >= s[0] && t < s[1]) || SCENES[SCENES.length - 1];
  ctx.save(); sc[2](t); ctx.restore();
  const fade = Math.max(0, 1 - (t - sc[0]) / .25, sc[1] < 900 ? 1 - (sc[1] - t) / .25 : 0);
  if (fade > 0 && !(sc[2] === scPlant && t < 7.5) && !(sc[2] === scDate && t > 6.9)) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
  if (!vign) { vign = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * .95); vign.addColorStop(0, 'rgba(0,0,0,0)'); vign.addColorStop(1, 'rgba(0,0,0,.55)'); }
  ctx.fillStyle = vign; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; noise(.05, 2); ctx.restore();
  if (t > 55.8) { text('ПРИПЯТЬ. 1986', W / 2, H / 2, { font: '72px "Russo One"', align: 'center', alpha: ease(prog(t, 55.8, 56.6)), spacing: 6 }); }
  if (subs) subtitles(t);

/* ---------- player ---------- */
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const seek = document.getElementById('seek'), timeEl = document.getElementById('time');
const playIco = document.getElementById('playIco'), playBtn = document.getElementById('playBtn');
const startOv = document.getElementById('startOv'), endOv = document.getElementById('endOv');
const linesEl = document.getElementById('lines');
let endT = null;

SUBS.forEach(([s, , ws]) => {
  const b = document.createElement('button'); b.className = 'line'; b.type = 'button';
  b.innerHTML = `<b>${fmt(s)}</b><span></span>`; b.querySelector('span').textContent = ws.map(w => w[0]).join(' ');
  b.addEventListener('click', () => { begin(s); });
  linesEl.appendChild(b);
});
const lineEls = [...linesEl.children];

function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1), w = cvs.clientWidth || 1280;
  cvs.width = Math.round(w * dpr); cvs.height = Math.round(w * dpr * 9 / 16); draw();
}
function curT() { return endT !== null ? endT : audio.currentTime; }
let lastLine = -2;
function draw() {
  if (!started) { frame(10.4, { subs: false }); return; }
  const t = curT();
  frame(t);
  seek.value = Math.min(t, DUR); timeEl.textContent = `${fmt(Math.min(t, DUR))} / ${fmt(DUR)}`;
  const li = currentSeg(t);
  if (li !== lastLine) { lineEls.forEach((el, i) => el.classList.toggle('on', i === li)); lastLine = li; }
}
let raf = 0, endStart = 0;
function loop() {
  if (endT !== null) endT = 55.72 + (performance.now() - endStart) / 1000;
  draw();
  if (!audio.paused || (endT !== null && endT < 57)) raf = requestAnimationFrame(loop);
}
function setIcon(playing) { playIco.innerHTML = playing ? '<path d="M3 2h3.5v12H3zm6.5 0H13v12H9.5z"/>' : '<path d="M3 1.5v13l11-6.5z"/>'; playBtn.setAttribute('aria-label', playing ? 'Пауза' : 'Воспроизвести'); }
function begin(at = 0) {

}

window.__frame = (t) => { started = true; startOv.hidden = true; frame(t); };
resize();
Promise.all(['400 30px "Russo One"', '700 36px Rubik', '16px "PT Mono"'].map(f => document.fonts.load(f))).then(() => draw()).catch(() => {});
</script>
