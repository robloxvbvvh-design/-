}, {"w": "поехать", "s": 25.15, "e": 25.68}, {"w": "на", "s": 25.63, "e": 25.84}, {"w": "корабле", "s": 25.79, "e": 26.28}];

// ---------- Сцены ----------
function scene1(t){
  const alarm=t>5.35;
  const zh=t<7.6?ease(seg(t,6.35,6.6)):1-ease(seg(t,7.6,7.9));
  cabin(t,{alarm,zhand:zh,doorOpen:ease(seg(t,9.2,9.55))});
  const stand=ease(seg(t,7.55,8.1)),walking=t>8.7&&t<9.95;
  const dx=t<8.7?300:lerp(300,1130,seg(t,8.7,9.95));
  const scared=ease(seg(t,5.45,5.75))*(1-ease(seg(t,7.3,7.6)));
  const face=t<5.45?'normal':(t<7.5?'scared':'angry');
  const sit=1-stand;
  const base=lerp(0.12,0.6,sit);
  person(Object.assign({},DIMA,{x:dx,y:560,sit,walk:walking?1:0,phase:t*11,face,blink:(t%3.1)<0.13,
    alpha:1-seg(t,9.7,9.95),bob:sit*Math.sin(t*2)*1.5,
    armF:walking?null:lerp(base,2.7,scared),armB:walking?null:lerp(base-0.1,2.4,scared)}));
  // табличка с именем
  if(t>2.1&&t<3.7){const a=seg(t,2.1,2.3)*(1-seg(t,3.5,3.7));ctx.save();ctx.globalAlpha=a;
    ctx.fillStyle='#2f6fd6';rr(240,236,120,46,12);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
    poly([[290,282],[310,282],[300,296]]);ctx.fill();outlined('ДИМА',300,260,28,'#fff','#173a75',5);ctx.restore();}
  pop(t,6.6,0.9,'ШЛЁП!',820,150,'#9be15d',44,0.1);
  if(t>5.9&&t<7.6){const k=back(seg(t,5.9,6.2)),a=1-seg(t,7.4,7.6);ctx.save();ctx.globalAlpha=a;ctx.translate(560+Math.sin(t*40)*3,110+Math.cos(t*33)*3);ctx.scale(k,k);
    outlined('ЗОМБИ-АПОКАЛИПСИС!',0,0,66,'#ff2222','#111',12);ctx.restore();}
  bubble(dx,292,'Надо выйти на палубу!',seg(t,8.3,8.45)*(1-seg(t,9.7,9.85)));
}
function scene2(t){
  deck(t);
  const picked=t>=13.2;
  crate(470,FY-62,90,60);
  if(!picked){ctx.strokeStyle='#5b3714';ctx.lineWidth=11;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(455,FY-68);ctx.lineTo(590,FY-74);ctx.stroke();ctx.strokeStyle='#8a5a2b';ctx.lineWidth=7;ctx.stroke();}
  // зомби
  const hits=[14.125,14.625,15.125];
  let zx=lerp(1380,800,seg(t,11.1,14.0));
  for(const h of hits)zx+=28*ease(seg(t,h,h+0.15));
  let zrot=0;for(const h of hits)zrot+=0.12*Math.max(0,1-Math.abs(t-h-0.08)/0.15);
  if(t>15.2)zrot=lerp(0,PI/2,easeIn(seg(t,15.2,15.6)));
  const zbreath=Math.sin(t*3)*0.12;
  person(Object.assign({},ZOMBIE,{x:zx,y:FY+(t>15.2?-8*seg(t,15.2,15.6):0),f:-1,walk:(t>11.1&&t<14)?0.55:0,phase:t*6,
    armF:t>15.2?0.4:1.5+zbreath,armB:t>15.2?0.3:1.4-zbreath,face:t>15.2?'dead':'zombie',rot:zrot}));
  // Дима
  let dx=380,walk=0,lean=0,sit=0,face='normal',armF=null,armB=null;
  if(t<11){dx=lerp(-60,380,seg(t,10,11));walk=1;}
  else if(t<12.6){face=t>11.2?'scared':'normal';}
  else if(t<12.95){dx=lerp(380,455,seg(t,12.6,12.95));walk=1;face='angry';}
  else if(t<13.9){dx=455;face='angry';const u=seg(t,12.95,13.45);const b=Math.sin(u*PI);lean=b*0.55;sit=b*0.5;
    armF=t<13.45?0.25+b*0.9:lerp(0.6,2.7,ease(seg(t,13.45,13.85)));}
  else if(t<14.05){dx=lerp(455,640,seg(t,13.9,14.05));walk=1;face='angry';armF=2.7;}
  else {dx=640;face='angry';armF=swingArm(t,14.0,3);
    if(t>15.55){armF=lerp(0.8,3.0,ease(seg(t,15.55,15.85)));face='happy';}}
  person(Object.assign({},DIMA,{x:dx,y:FY,walk,phase:t*11,lean,sit,face,armF,armB,stick:picked,blink:(t%2.7)<0.12}));
  exclaim(t,11.2,12.3,dx+10,300);
  pop(t,hits[0],0.5,'БАМ!',zx-10,360);
  pop(t,hits[1],0.5,'БАЦ!',zx,330,'#ffde3b',64,0.1);
  pop(t,hits[2],0.8,'ХРЯСЬ!',zx-20,350,'#ff8a2b',72);
  badge(t,1,'ПЕРВЫЙ',12.11);
}
function scene3(t){
  const doorOpen=t<17.9?1:1-seg(t,17.9,18.0);
  cabin(t,{doorOpen,sign:seg(t,18.05,18.4)});
  let zx=300,zy=560,zsit=1,zrot=0,zface='zombie',zal=1,flying=false;
  if(t>16.7)zsit=1-ease(seg(t,16.7,16.95));
  if(t>17.15){const u=seg(t,17.15,17.85);zx=lerp(300,1150,u);zy=560-Math.sin(u*PI)*360;zrot=u*2*PI;zface='scared';zal=1-seg(t,17.72,17.85);flying=true;}
  const zombie=()=>person(Object.assign({},ZOMBIE,{x:zx,y:zy,sit:zsit,f:1,face:zface,rot:zrot,alpha:zal,
    armF:flying?2.8:lerp(0.6,1.5,1-zsit),armB:flying?2.6:lerp(0.5,1.4,1-zsit)}));
  if(!flying)zombie();
  const dx=lerp(1130,450,seg(t,16.0,16.75));
  let armF=2.6,f=-1,face='angry';
  if(t>16.95)armF=lerp(2.7,0.8,ease(seg(t,16.95,17.15)));
  if(t>17.9){f=1;face='happy';armF=lerp(0.8,3.0,ease(seg(t,18.0,18.3)));}
  const dx2=t>17.9?lerp(450,640,ease(seg(t,17.9,18.25))):dx;
  person(Object.assign({},DIMA,{x:dx2,y:560,f,walk:(t<16.75||(t>17.9&&t<18.25))?1:0,phase:t*11,face,armF,stick:true,alpha:seg(t,16.0,16.15)}));
  if(flying)zombie();
  pop(t,17.15,0.6,'БУМ!',330,360);
  pop(t,18.0,0.6,'БАХ!',1130,320,'#ffde3b',60,0.12);
  badge(t,2,'ВТОРОЕ',15.99);
}
function scene4(t){
  const knocks=[19.3,19.55,20.25,20.5];
  let shake=0;for(const k of knocks)if(t>=k)shake=Math.max(shake,1-(t-k)/0.15);
  cabin(t,{night:true,clock:true,sign:1,doorShake:shake,barricade:true});
  const jump=shake>0.2;
  person(Object.assign({},DIMA,{x:300,y:560,sit:1,face:jump?'scared':'normal',blink:(t%2.2)<0.12,bob:Math.sin(t*2)*1.5,
    armF:0.7,armB:0.55,stick:true,stickA:PI-0.95}));
  for(let i=0;i<knocks.length;i++)pop(t,knocks[i],0.45,'ТУК!',1100+(i%2)*70,250+(i%2)*40,'#ffffff',44,i%2?0.15:-0.15);
  if(t>19.0&&t<20.95){const a=seg(t,19.0,19.2)*(1-seg(t,20.8,20.95));bubble(320,345,'Ждём'+'.'.repeat(1+Math.floor((t*3)%3)),a,28);}
  badge(t,3,'ТРЕТЬЕ',18.67);
}
let hatT=null;
function scene5(t){
  bridge(t);
  const z=seg(t,22.9,23.8);
  let cx=780,cy=560,crot=0,walking=false;
  if(z>0&&z<1)cx+=Math.sin(t*70)*4;
  if(t>23.8){cx=lerp(780,600,seg(t,23.8,24.2));walking=t<24.2;}
  const hit=t>24.25;
  if(hit){const u=seg(t,24.25,24.5);cx=600+u*800;cy=560-Math.sin(u*PI*0.8)*200;crot=u*3;}
  person(Object.assign({},CAPTAIN,{x:cx,y:cy,f:-1,rot:crot,skin:mix('#f2c29b','#8fbf6a',z),zombie:z>0.5,
    face:hit?'dead':(z>0.45?'zombie':'normal'),hat:hit?null:'captain',walk:walking?0.55:0,phase:t*6,
    armF:lerp(1.15,1.55,z)+(z>=1?Math.sin(t*3)*0.1:0),armB:lerp(1.05,1.45,z)}));
  wheel(700,395,58,t<22.9?Math.sin(t*1.5)*0.3:t*2);
  // фуражка летит к Диме
  if(hit){const u=ease(seg(t,24.25,24.5));const hx=lerp(600,440,u),hy=lerp(330,330,u)-Math.sin(u*PI)*120;
    ctx.save();ctx.translate(hx,hy);ctx.rotate((1-u)*6);captainHat();ctx.restore();}
  let dx=lerp(-60,330,seg(t,21.0,21.8)),face='normal',armF=0.5;
  if(t>22.3)face='scared';
  if(t>23.85){face='angry';dx=lerp(330,440,seg(t,23.85,24.05));armF=lerp(0.5,2.7,ease(seg(t,23.85,24.05)));}
  if(t>24.05)armF=lerp(2.7,0.8,ease(seg(t,24.05,24.25)));
  person(Object.assign({},DIMA,{x:dx,y:560,walk:(t<21.8||(t>23.85&&t<24.05))?1:0,phase:t*11,face,armF,stick:true,blink:(t%2.5)<0.12}));
  exclaim(t,22.3,23.0,dx+10,290);
  pop(t,23.8,0.55,'РРРР!',cx,250,'#9be15d',56,0.12);
  pop(t,24.25,0.3,'БОНК!',560,300,'#ffde3b',70);
  badge(t,4,'ЧЕТВЁРТОЕ',21.15);
}
function scene6(t){
  seaScene(t,true);
  if(t>24.8&&t<26.6){const a=seg(t,24.8,25.0)*(1-seg(t,26.4,26.6));const k=back(seg(t,24.8,25.1));
    ctx.save();ctx.globalAlpha=a;ctx.translate(640,110);ctx.scale(k,k);outlined('КАПИТАН ДИМА!',0,0,64,'#ffde3b','#111',12);ctx.restore();}
  if(t>26.5){const a=seg(t,26.5,27.0),k=back(seg(t,26.5,26.9));
    ctx.save();ctx.globalAlpha=a;ctx.translate(640,120);ctx.scale(k,k);outlined('КОНЕЦ',0,0,96,'#ffffff','#111',14);ctx.restore();}
}

function frame(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  let amp=(t>5.35&&t<7.5)?5:0;
  for(const h of [14.125,14.625,15.125,17.15,18.0,24.25])if(t>=h)amp+=10*Math.max(0,1-(t-h)/0.2);
  ctx.save();
  if(amp>0){ctx.translate(W/2+Math.sin(t*90)*amp,H/2+Math.cos(t*77)*amp);const s=1+amp/250;ctx.scale(s,s);ctx.translate(-W/2,-H/2);}
  if(t<10)scene1(t);else if(t<16)scene2(t);else if(t<18.6)scene3(t);else if(t<21)scene4(t);else if(t<24.5)scene5(t);else scene6(t);
  ctx.restore();
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.45,W/2,H/2,H*0.95);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.45)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  let fade=1-seg(t,0,0.3);
  for(const B of [10,16,18.6,21,24.5])fade=Math.max(fade,1-Math.abs(t-B)/0.18);
  if(fade>0){ctx.fillStyle=`rgba(0,0,0,${fade})`;ctx.fillRect(0,0,W,H);}
  subs(t);
}
window.frame=frame;window.DURATION=DURATION;
if(!/[?&]render/.test(location.search)&&location.protocol!=='about:'){ // живой предпросмотр в браузере
  const t0=performance.now();(function loop(){frame(((performance.now()-t0)/1000)%DURATION);requestAnimationFrame(loop);})();
}
