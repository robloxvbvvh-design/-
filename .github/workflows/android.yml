name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MobileCraftLauncher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MobileCraftLauncher-debug
          path: MobileCraftLauncher.apk

      - name: Publish APK to the "latest" release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MobileCraft Launcher (последняя сборка)
          prerelease: true
          make_latest: false
          body: Автоматическая сборка из ветки ${{ github.ref_name }} (${{ github.sha }}).
          files: MobileCraftLauncher.apk
