name: Ночной агент идей

on:
  schedule:
    - cron: "17 0 * * *"   # каждую ночь в 03:17 по Москве (00:17 UTC)
  workflow_dispatch:        # ручной запуск кнопкой "Run workflow"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Найти видео, написать сценарии, озвучить
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m agent.main

      - name: Сохранить результат в репозиторий
        run: |
          git config user.name "night-agent"
          git config user.email "night-agent@users.noreply.github.com"
          git add output
          git commit -m "Идеи за $(date -u +%Y-%m-%d)" || echo "Нечего коммитить"
          git push
