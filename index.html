<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тимофей в 90-х</title>
<style>
@font-face{font-family:"Russo One";src:url("fonts/RussoOne-Regular.ttf")}
:root{--bg1:#1a0f2e;--bg2:#3a0b12;--fg:#fff;--hot:#ff2a2a}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at center,var(--bg2),var(--bg1) 70%,#07040c);color:var(--fg);
 font-family:"Russo One",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
#sub{min-height:3.2em;max-width:min(92vw,900px);padding:0 16px;text-align:center;font-size:clamp(28px,6vw,64px);line-height:1.25;
 text-shadow:0 0 4px #000,0 3px 0 #000,0 0 14px rgba(0,0,0,.8)}
.w{display:inline-block;margin:0 .14em;transition:color .08s,transform .12s}
.w.on{color:var(--hot);transform:scale(1.12);text-shadow:0 0 18px rgba(255,40,40,.7),0 3px 0 #000}
#line{animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#play{margin-top:48px;font:inherit;font-size:20px;color:#fff;background:var(--hot);border:0;border-radius:999px;padding:14px 34px;cursor:pointer;box-shadow:0 6px 24px rgba(255,42,42,.4)}
#bar{position:fixed;left:0;bottom:0;height:5px;background:var(--hot);width:0}
</style>
</head>
<body>
<div id="sub"></div>
<button id="play">▶ Играть</button>
<div id="bar"></div>
<audio id="a" src="audio.mp3" preload="auto"></audio>
<script>

 "что", "start": 30.64, "end": 30.86}, {"text": "через", "start": 30.88, "end": 31.22}, {"text": "два", "start": 31.24, "end": 31.46}, {"text": "дня,", "start": 31.48, "end": 31.74}]}, {"start": 31.92, "end": 32.88, "words": [{"text": "в", "start": 31.92, "end": 32.02}, {"text": "третий", "start": 32.09, "end": 32.5}, {"text": "день", "start": 32.53, "end": 32.78}]}, {"start": 32.88, "end": 34.3, "words": [{"text": "откроется", "start": 32.88, "end": 33.46}, {"text": "портал.", "start": 33.44, "end": 33.71}]}, {"start": 34.3, "end": 35.77, "words": [{"text": "Ты", "start": 34.3, "end": 34.47}, {"text": "заходишь", "start": 34.49, "end": 34.96}, {"text": "в", "start": 34.93, "end": 35.03}, {"text": "компьютер,", "start": 35.05, "end": 35.67}]}, {"start": 35.77, "end": 37.09, "words": [{"text": "играешь", "start": 35.77, "end": 36.23}, {"text": "в", "start": 36.25, "end": 36.35}, {"text": "змейку.", "start": 36.37, "end": 36.91}]}, {"start": 37.09, "end": 38.93, "words": [{"text": "Тебе", "start": 37.09, "end": 37.35}, {"text": "нравится", "start": 37.41, "end": 37.95}, {"text": "это", "start": 37.93, "end": 38.15}, {"text": "время.", "start": 38.18, "end": 38.51}]}, {"start": 38.93, "end": 41.05, "words": [{"text": "СССР", "start": 38.93, "end": 39.76}, {"text": "только", "start": 39.85, "end": 40.15}, {"text": "распался…", "start": 40.18, "end": 40.84}]}, {"start": 41.05, "end": 42.67, "words": [{"text": "Ты", "start": 41.05, "end": 41.23}, {"text": "спишь.", "start": 41.25, "end": 41.67}]}];
const a = document.getElementById('a'), sub = document.getElementById('sub'),
      btn = document.getElementById('play'), bar = document.getElementById('bar');
let curLine = -1, spans = [];
function show(i){
  curLine = i; sub.innerHTML = '';
  if (i < 0) return;
  const div = document.createElement('div'); div.id = 'line';
  spans = LINES[i].words.map(w => { const s = document.createElement('span'); s.className = 'w'; s.textContent = w.text; div.append(s, ' '); return s; });
  sub.append(div);
}
function tick(){
  const t = a.currentTime;
  let i = LINES.findIndex(l => t >= l.start && t < l.end);
  if (i !== curLine) show(i);
  if (i >= 0) {
    const ws = LINES[i].words;
    let k = -1; for (let j = 0; j < ws.length; j++) if (t >= ws[j].start) k = j;
    spans.forEach((s, j) => s.classList.toggle('on', j === k));
  }
  bar.style.width = (a.duration ? t / a.duration * 100 : 0) + '%';
  if (!a.paused) requestAnimationFrame(tick);
}
btn.onclick = () => { if (a.paused) { a.play(); btn.textContent = '❚❚ Пауза'; requestAnimationFrame(tick); } else { a.pause(); btn.textContent = '▶ Играть'; } };
a.onended = () => { btn.textContent = '↺ Ещё раз'; show(-1); };
</script>
</body>
</html>
