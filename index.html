<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тимофей в 90-х</title>
<style>
  :root { --bg: #07040c; --hot: #ff2a2a; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Russo One", system-ui, sans-serif; }
  canvas { height: 100vh; max-width: 100vw; aspect-ratio: 9 / 16; object-fit: contain; display: block; }
  #play { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); font: inherit; font-size: 22px; color: #fff;
          background: var(--hot); border: 0; border-radius: 999px; padding: 16px 38px; cursor: pointer; box-shadow: 0 6px 24px rgba(255,42,42,.5); }
  #play.hidden { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<button id="play">▶ Смотреть</button>
<audio id="a" src="audio.mp3" preload="auto"></audio>
<script src="anim/scene.js"></script>
<script>
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const a = document.getElementById('a'), btn = document.getElementById('play');
  let LINES = [];
  window.ready = (async () => {
    const font = new FontFace('Russo One', 'url(fonts/RussoOne-Regular.ttf)');
    document.fonts.add(await font.load());
    LINES = await (await fetch('words.json')).json();
    drawFrame(ctx, 2.0, LINES);
  })();
  window.renderAt = t => { drawFrame(ctx, t, LINES); return cv.toDataURL('image/jpeg', 0.92); };
  function loop() { drawFrame(ctx, a.currentTime, LINES); if (!a.paused) requestAnimationFrame(loop); }
  btn.onclick = async () => { await window.ready; a.currentTime = 0; a.play(); btn.classList.add('hidden'); requestAnimationFrame(loop); };
  cv.onclick = () => { if (a.paused) { a.play(); requestAnimationFrame(loop); } else a.pause(); };
  a.onended = () => { btn.textContent = '↺ Ещё раз'; btn.classList.remove('hidden'); };
</script>
</body>
</html>
